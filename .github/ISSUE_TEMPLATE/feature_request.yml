name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: How it should work, and alternatives you considered.
    validations:
      required: true

  - type: checkboxes
    id: offline
    attributes:
      label: Constraints
      options:
        - label: This works offline and keeps library data on the device.
          required: true
