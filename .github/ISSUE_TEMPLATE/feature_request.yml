name: Feature request
description: Got an idea? Big or small, we'd love to hear it
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Shelf! Rough ideas are welcome, no need to have it all
        figured out.

  - type: textarea
    id: problem
    attributes:
      label: What would make Shelf better for you?
      description: Something missing, clunky or just a nice-to-have.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Any thoughts on how it could work?
      description: Optional. Sketches, examples from other apps, anything helps.
