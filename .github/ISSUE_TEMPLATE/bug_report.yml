name: Bug report
description: Something in the app, builder or catalogue is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you got.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Shelf version
      placeholder: v1.2.3 (Settings → About)
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Install source
      options: [GitHub APK, F-Droid, Obtainium, Built from source]
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
