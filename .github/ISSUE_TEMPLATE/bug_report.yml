name: Bug report
description: Something not working right? Let us know
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Every report helps make Shelf better.
        Fill in what you can, partial info is fine.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Shelf version
      description: Found under Settings → About.
      placeholder: v1.2.3

  - type: dropdown
    id: source
    attributes:
      label: Install source
      options: [GitHub APK, F-Droid, Obtainium, Built from source, Not sure]

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional, but often a big help.
      render: text
