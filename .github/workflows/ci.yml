name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/tooling/target

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: NDK and CMake
        run: >
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "ndk;30.0.16248370" "cmake;3.31.6" > /dev/null

      - name: ktlint
        env:
          KTLINT: https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o ktlint "$KTLINT"
          echo "$KTLINT_SHA256  ktlint" | sha256sum -c -
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt"

      - run: >
          ./gradlew assembleGithubDebug lintGithubDebug lintFdroidRelease
          minifyGithubReleaseWithR8 testGithubDebugUnitTest testFdroidDebugUnitTest

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tooling/target
          key: rust-${{ hashFiles('tooling/*/Cargo.lock', 'tooling/*/Cargo.toml') }}
          restore-keys: rust-

      - run: sudo apt-get install -y nasm

      - run: rustup component add rustfmt clippy

      - name: builder
        working-directory: tooling/builder
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: server
        working-directory: tooling/server
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

  scan:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: apt-get update && apt-get install -y python3-onnx python3-yaml python3-numpy

      - run: python3 tooling/scan.py /tmp/scan.bin

      - run: cmp /tmp/scan.bin android/app/src/main/assets/scan.bin

  apks:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: NDK and CMake
        run: >
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "ndk;30.0.16248370" "cmake;3.31.6" > /dev/null

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleGithubRelease assembleUpdateRelease assembleFdroidRelease
          --parallel

      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*.apk dist/shelf.apk
          cp app/build/outputs/apk/update/release/*.apk dist/shelf-update.apk
          cp app/build/outputs/apk/fdroid/release/*.apk dist/shelf-fdroid.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)
          code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          for locale in app/fastlane/metadata/android/*/; do
            language=$(basename "$locale")
            cp "$locale/changelogs/$code.txt" "dist/changelog-${language%%-*}.txt"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: android/dist
          retention-days: 3

  release:
    needs: [android, rust, scan, apks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Shelf $GITHUB_REF_NAME" --generate-notes

