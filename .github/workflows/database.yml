name: database

on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:
    inputs:
      rebase:
        description: Build full segments and reset the delta chain
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: database

env:
  GH_TOKEN: ${{ github.token }}
  DUMPS: https://openlibrary.org/data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: builder

      - name: Prepare tools
        run: |
          cargo build --release --locked --manifest-path builder/Cargo.toml &
          sudo apt-get install -y -qq aria2
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet ctranslate2 transformers sentencepiece
          wait

      - name: Fetch inputs
        run: |
          latest=$(gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("catalogue-"))] | sort | last // ""')
          release=$(date -u +%F)
          for suffix in 1 2 3; do
            gh release view "catalogue-$release" >/dev/null 2>&1 || break
            release=$(date -u +%F)-$suffix
          done
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          mkdir -p previous
          sudo install -d -o "$USER" /mnt/dumps
          [ -n "$latest" ] && gh release download "$latest" --dir previous \
            --pattern 'state-*.bin' --pattern 'translations-*.bin' \
            --pattern manifest.json &
          for name in reading-log ratings authors covers_metadata editions works; do
            echo "$DUMPS/ol_dump_${name}_latest.txt.gz"
          done | aria2c --input-file - --dir /mnt/dumps --max-concurrent-downloads 6 \
            --split 16 --max-connection-per-server 16 --min-split-size 64M \
            --max-tries 20 --retry-wait 5 --file-allocation none \
            --console-log-level warn --summary-interval 60
          wait
          du -sh /mnt/dumps

      - name: Build database
        run: |
          builder/target/release/builder /mnt/dumps out \
            --month "$RELEASE" --previous previous --translations previous \
            --requests requests ${{ inputs.rebase && '--rebase' || '' }} \
            --translator "python tooling/translate.py --device cpu \
              --compute-type int8 --limit 20000"
          du -sh out

      - name: Publish release
        run: |
          gh release create "catalogue-$RELEASE" --latest=false \
            --title "Catalogue $RELEASE" \
            --notes "Open Library catalogue segments, ranks and state for $RELEASE." \
            out/*

      - name: Prune unreferenced releases
        run: |
          jq -r '.segments[].url | split("/")[-2]' out/manifest.json > referenced
          echo "catalogue-$RELEASE" >> referenced
          gh release list --limit 200 --json tagName \
            --jq '.[].tagName | select(startswith("catalogue-"))' \
            | { grep -vxF -f referenced || true; } \
            | while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
