name: database

on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:
    inputs:
      rebase:
        description: Build full segments and reset the delta chain
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: database

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            builder/target
          key: cargo-${{ runner.os }}-${{ hashFiles('builder/Cargo.lock') }}

      - name: Build builder
        run: |
          rustup update stable --no-self-update
          cargo build --release --locked --manifest-path builder/Cargo.toml

      - name: Download previous state
        run: |
          tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^catalogue-' || true)
          day=$(date -u +%F)
          release=$day
          build=0
          while grep -qx "catalogue-$release" <<< "$tags"; do
            build=$((build + 1))
            release=$day-$build
          done
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          mkdir -p previous
          previous=$(sort -V <<< "$tags" | tail -n 1)
          if [ -n "$previous" ]; then
            gh release download "$previous" --dir previous \
              --pattern 'state-*.bin' --pattern manifest.json
          fi

      - name: Download dumps
        run: |
          sudo apt-get install -y aria2
          sudo mkdir -p /mnt/dumps && sudo chown "$USER" /mnt/dumps
          for name in reading-log ratings authors covers_metadata editions works; do
            file="ol_dump_${name}_latest.txt.gz"
            printf '%s\n  out=%s\n' "https://openlibrary.org/data/$file" "$file"
          done > /mnt/dumps/urls.txt
          aria2c --input-file /mnt/dumps/urls.txt --dir /mnt/dumps \
            --max-concurrent-downloads 6 --split 16 --max-connection-per-server 16 \
            --min-split-size 64M --max-tries 20 --retry-wait 5 \
            --file-allocation none --console-log-level warn --summary-interval 60
          du -sh /mnt/dumps

      - name: Build database
        run: |
          flags=(--previous previous --month "$RELEASE")
          if [ "${{ inputs.rebase }}" = "true" ]; then flags+=(--rebase); fi
          builder/target/release/builder /mnt/dumps out "${flags[@]}"
          du -sh out

      - name: Publish release
        run: |
          gh release create "catalogue-$RELEASE" --draft --latest=false \
            --title "Catalogue $RELEASE" \
            --notes "Open Library catalogue segments, ranks and state for $RELEASE."
          for file in out/*; do
            gh release upload "catalogue-$RELEASE" "$file" --clobber
          done
          gh release edit "catalogue-$RELEASE" --draft=false --latest=false
