[package]
name = "server"
version = "0.1.0"
edition = "2024"
description = "Shelf book pages, API and AVIF covers, served at shelf-books.tn3w.dev"
repository = "https://github.com/tn3w/Shelf"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
askama = "0.14"
axum = "0.8.9"
builder = { path = "../builder" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
listenfd = "1.0.2"
mimalloc = "0.1.52"
pow = { path = "pow" }
ravif = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rgb = "0.8.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "net", "sync", "time"] }

[build-dependencies]
brotli = "8"
lightningcss = "1.0.0-alpha.72"
oxc = { version = "0.154", features = ["minifier", "codegen"] }
sha2 = "0.11.1"

[workspace]
members = ["pow"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.dev.package."*"]
opt-level = 3
