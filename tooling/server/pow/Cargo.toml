[package]
name = "pow"
version = "0.1.0"
edition = "2024"
description = "Proof-of-work gate for axum: JSON PoW, no-script puzzle, signed tokens"
publish = false

[dependencies]
askama = "0.14"
axum = "0.8"
getrandom = "0.3"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
