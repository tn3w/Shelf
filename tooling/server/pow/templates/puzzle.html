{% extends "base.html" %}
{% block body %}<main class=center><p>{{ note }}Type the {{ crate::DIGITS }} digits to continue.</p>
<svg viewBox="0 0 300 100" width=300 height=100 role=img aria-label="Digits image. Screen reader users: enable JavaScript, the automatic check needs no input."><path d="{{ puzzle.drawing }}" fill=none stroke=currentColor stroke-width=5 stroke-linecap=round stroke-linejoin=round /></svg>
<form method=post action=/pow><input type=hidden name=c value={{ puzzle.challenge }}><input type=hidden name=r value="{{ back }}"><input name=a inputmode=numeric autocomplete=off required autofocus placeholder=12345 aria-label=Digits><button>Continue</button></form><p class=muted>Can’t read it? Enable JavaScript for the automatic check, or reload for new digits.</p></main>{% endblock %}
