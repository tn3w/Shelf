# The build downloads the catalogue data packs pinned by the tag in app/build.gradle.kts
# and verifies each against the sha256 in the release manifest. They are data, not code:
# public-domain Open Library dumps compiled by builder/ in this repository.
Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    gradle:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v.*
CurrentVersion: 1.0.0
CurrentVersionCode: 1
