[package]
name = "builder"
version = "0.1.0"
edition = "2024"
description = "Builds the Shelf catalogue from Open Library dumps"
repository = "https://github.com/tn3w/Shelf"
license = "MIT"
publish = false

[dependencies]
flate2 = { version = "1.1", features = ["zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
